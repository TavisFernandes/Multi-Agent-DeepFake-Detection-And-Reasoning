kind = "web"
previewPath = "/"
title = "Deepfake Detection System"
version = "1.0.0"
id = "artifacts/deepfake-detector"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19666

[services.development]
run = "pnpm --filter @workspace/deepfake-detector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deepfake-detector", "run", "build" ]
serve = "static"
publicDir = "artifacts/deepfake-detector/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19666"
BASE_PATH = "/"
